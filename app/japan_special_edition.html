<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="./images/japan_tabi_logo.png">
  <title>Editorial Special Issues ｜ JAPAN TABI 深度專題名鑑</title>

  <!-- Google Fonts: Editorial High-End Serif & Clean Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+TC:wght@400;600;900&family=Noto+Serif+JP:wght@400;600;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FAF8F5;
      --card-bg: #FFFFFF;
      --ink-charcoal: #1C1917;
      --text-sub: #78716C;
      --border-sand: #E7E5E4;
      --earth-gold: #B45309;
      --sacred-moss: #29432B;
      --font-serif: 'Cormorant Garamond', 'Noto Serif TC', 'Noto Serif JP', serif;
      --font-display: 'Playfair Display', 'Noto Serif TC', 'Noto Serif JP', serif;
      --font-sans: 'Outfit', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-cream);
      color: var(--ink-charcoal);
      font-family: var(--font-sans);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* Magazine Top Header (全站統一單行標籤 ＋ 語系切換) */
    .mag-header {
      border-bottom: 1px solid var(--border-sand);
      padding: 14px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(250, 248, 245, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .mag-logo-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .mag-logo {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink-charcoal);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mag-issue-tag {
      font-size: 0.72rem;
      font-family: var(--font-sans);
      letter-spacing: 1.2px;
      color: var(--earth-gold);
      border: 1px solid var(--earth-gold);
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 700;
    }

    /* 頂部全站導航列 (乾淨無外框、無ICON) */
    .header-nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .header-nav-links a {
      font-size: 0.86rem;
      font-weight: 700;
      color: #44403C;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .header-nav-links a:hover,
    .header-nav-links a.active {
      color: #B45309;
    }

    /* 語系切換器 */
    .mag-lang-picker {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #FFFFFF;
      border: 1px solid var(--border-sand);
      padding: 3px;
      border-radius: 9999px;
    }
    .btn-lang-pill {
      background: transparent;
      border: none;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 9999px;
      color: #78716C;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-lang-pill:hover {
      color: #1C1917;
    }
    .btn-lang-pill.active {
      background: #1C1917;
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    /* 🌊 雜誌首頁 Hero Banner (參考 Travel Packages / Crafted for You) */
    .packages-hero {
      position: relative;
      width: 100%;
      min-height: 440px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 90px 24px 80px;
      background: url('https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=1800&q=80') center/cover no-repeat;
      color: #FFFFFF;
      overflow: hidden;
    }
    .packages-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.65) 100%);
    }
    .packages-hero-content {
      position: relative;
      z-index: 2;
      max-width: 820px;
      margin: 0 auto;
    }
    .packages-hero-title {
      font-family: var(--font-display);
      font-size: 3.5rem;
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .packages-hero-title em {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
    }
    .packages-hero-sub {
      font-size: 1.05rem;
      color: #E2E8F0;
      line-height: 1.6;
      max-width: 680px;
      margin: 0 auto;
      font-weight: 400;
      text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* 🖼️ 3 欄直式雜誌卡片網格 (6張卡片) */
    .packages-grid-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }
    .packages-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }
    @media (max-width: 960px) {
      .packages-grid { grid-template-columns: repeat(2, 1fr); gap: 24px; }
      .packages-hero-title { font-size: 2.8rem; }
    }
    @media (max-width: 600px) {
      .packages-grid { grid-template-columns: 1fr; }
      .packages-hero { padding: 60px 20px; min-height: 360px; }
      .packages-hero-title { font-size: 2.2rem; }
    }

    .package-card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      color: #FFFFFF;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
      cursor: pointer;
      text-decoration: none;
    }
    .package-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.22);
    }
    .package-card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }
    .package-card:hover .package-card-bg {
      transform: scale(1.06);
    }
    .package-card-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.3) 0%, rgba(15, 23, 42, 0.35) 40%, rgba(15, 23, 42, 0.92) 100%);
      z-index: 2;
    }
    .card-top-badge {
      position: relative;
      z-index: 3;
      align-self: flex-start;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .card-bottom-content {
      position: relative;
      z-index: 3;
    }
    .card-issue-title {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 8px;
      color: #FFFFFF;
    }
    .card-issue-blurb {
      font-size: 0.82rem;
      color: #CBD5E1;
      line-height: 1.55;
      margin-bottom: 18px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }
    .card-price-box {
      display: flex;
      flex-direction: column;
    }
    .card-price-label {
      font-size: 0.68rem;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card-price-val {
      font-size: 1.05rem;
      font-weight: 800;
      color: #FFFFFF;
    }
    .btn-learn-more {
      background: #FFFFFF;
      color: #0F172A;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 8px 18px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .package-card:hover .btn-learn-more {
      background: #F8FAFC;
      transform: scale(1.04);
    }

    /* 📖 單篇完整文章檢視器 (Article Reader View) */
    .article-reader-view {
      display: none;
    }
    .reader-back-bar {
      max-width: 1080px;
      margin: 20px auto 0;
      padding: 0 24px;
    }
    .btn-back-to-catalog {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      border: 1px solid var(--border-sand);
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #44403C;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-back-to-catalog:hover {
      background: #F5F5F4;
      color: #000;
      transform: translateX(-2px);
    }

    /* 雜誌排版樣式 */
    .article-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 24px 100px;
    }
    .hero-editorial {
      text-align: center;
      max-width: 860px;
      margin: 0 auto 60px;
    }
    .hero-meta {
      font-size: 0.78rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--earth-gold);
      margin-bottom: 16px;
      font-weight: 600;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: 3.4rem;
      line-height: 1.15;
      font-weight: 400;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }
    .hero-subtitle {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-style: italic;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .hero-lead-photo {
      width: 100%;
      height: 520px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.06);
    }
    .hero-lead-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-caption {
      font-size: 0.74rem;
      color: var(--text-sub);
      font-family: var(--font-serif);
      font-style: italic;
      text-align: center;
    }
    .essay-section {
      max-width: 760px;
      margin: 50px auto 80px;
    }
    .essay-section p {
      font-size: 1.05rem;
      line-height: 1.85;
      color: #292524;
      margin-bottom: 24px;
    }
    .essay-section p:first-of-type::first-letter {
      font-family: var(--font-display);
      font-size: 3.8rem;
      float: left;
      line-height: 0.8;
      padding-right: 12px;
      padding-top: 4px;
      color: var(--earth-gold);
    }
    .section-eyebrow {
      font-size: 0.72rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--earth-gold);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .section-headline {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 400;
      margin-bottom: 36px;
    }
    .cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 32px;
      margin-bottom: 80px;
    }
    .mag-card {
      background: var(--card-bg);
      border: 1px solid var(--border-sand);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      transition: transform 0.25s ease;
    }
    .mag-card:hover {
      transform: translateY(-4px);
    }
    .card-photo {
      height: 220px;
      overflow: hidden;
      position: relative;
    }
    .card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-badge {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(28, 25, 23, 0.85);
      color: #FFF;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 4px;
    }
    .card-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .card-subtext {
      font-size: 0.78rem;
      color: var(--earth-gold);
      font-weight: 600;
      margin-bottom: 12px;
    }
    .card-desc {
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .card-footer-btn {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border-sand);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-reserve {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--ink-charcoal);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-reserve:hover {
      color: var(--earth-gold);
    }
    .timeline-container {
      background: #FFFFFF;
      border: 1px solid var(--border-sand);
      border-radius: 12px;
      padding: 36px 40px;
      margin-bottom: 80px;
    }
    .itinerary-day {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 24px;
      padding: 24px 0;
      border-bottom: 1px dashed var(--border-sand);
    }
    .itinerary-day:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .day-marker {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--sacred-moss);
    }
    .day-content h4 {
      font-size: 1.05rem;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .day-content p {
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.65;
    }
    .trip-affiliate-box {
      background: linear-gradient(135deg, #1C1917 0%, #292524 100%);
      color: #FFF;
      border-radius: 16px;
      padding: 48px;
      margin-bottom: 80px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
      align-items: center;
    }
    @media (max-width: 860px) {
      .trip-affiliate-box { grid-template-columns: 1fr; padding: 32px 24px; }
      .itinerary-day { grid-template-columns: 1fr; gap: 8px; }
    }
    .affiliate-heading {
      font-family: var(--font-display);
      font-size: 2.1rem;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 14px;
    }
    .affiliate-desc {
      font-size: 0.88rem;
      color: #D6D3D1;
      line-height: 1.6;
    }
    .affiliate-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-trip-action {
      background: var(--earth-gold);
      color: #FFF;
      padding: 14px 24px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.25s ease;
    }
    .btn-trip-action:hover {
      background: #92400e;
    }
    .btn-trip-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-trip-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .mag-footer {
      border-top: 1px solid var(--border-sand);
      padding: 50px 24px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-sub);
    }
  </style>
</head>

        <span>JAPAN TABI</span>
      </a>

    <!-- 全站頂部導航連結 -->
    <nav class="header-nav-links">

  </footer>

Allianceid=9507030&SID=325761227&trip_sub3=D20272275"}, {"photo": "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=700&q=80", "badge": "Heritage Soba", "title": "Sanshiro Teuchi Soba", "sub": "100% Stone-Ground Buckwheat", "desc": "Hand-cut cold zaru soba served with mountain wasabi and local spring water from sacred Kumano headwaters.", "loc": "Nachi Waterfall Route", "btn": "Explore Spot ➔", "url": "#"}, {"photo": "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=700&q=80", "badge": "Historic Roastery", "title": "Kumano Coffee Roastery", "sub": "Single Origin Pour-over ｜ Katsuura", "desc": "Artisan coffee brewed with cedar-aged spring water, overlooking the Pacific fishing harbour of Katsuura.", "loc": "Katsuura Port", "btn": "View Menu ➔", "url": "#"}], "planEyebrow": "Curated 3-Day Pilgrimage Blueprint", "planTitle": "Kumano Kodō Nakahechi Route", "days": [{"day": "Day 01", "title": "Tanabe to Takijiri-oji: Entering the Sacred Forest", "desc": "Depart Osaka/Kyoto by Kuroshio Express. Begin trek at Takijiri-oji, the ancient threshold where mortal realm yields to holy ground. Ascent through giant roots to Takahara ridge."}, {"day": "Day 02", "title": "Hosshinmon-oji to Kumano Hongu Taisha", "desc": "Walk along gentle ridge trails dotted with tea plantations. Arrive at Kumano Hongu Taisha and marvel at Oyunohara, the towering 34-meter Torii gate rising from river sandbars."}, {"day": "Day 03", "title": "Daimon-zaka & Nachi Primeval Waterfall", "desc": "Descend the monumental Daimon-zaka stone staircase beneath 800-year-old cedars to Seiganto-ji's vermilion pagoda framing the 133-meter Nachi Falls."}], "affiliateTitle": "Plan Your Kumano Pilgrimage", "affiliateDesc": "Reserve Osaka/KIX direct flights and book private Kyoto-Kii charter vehicles or express train passes with instant confirmation.", "flightBtn": "✈️ Search Osaka (KIX) Flights ➔", "flightUrl": "https://tw.trip.com/flights/taipei-to-osaka?Allianceid=9507030&SID=325761227&trip_sub3=D20272275", "carBtn": "🚗 Book Kii Peninsula Private Van ➔", "carUrl": "https://tw.trip.com/carhire?Allianceid=9507030&SID=325761227&trip_sub3=D20272275"}, "zh": {"title": "熊野古道", "fullTitle": "熊野古道：千年靈性朝聖巡禮 ｜ JAPAN TABI 深度名鑑", "meta": "世界文化遺產朝聖 ｜ 森林療癒之道", "subtitle": "「千年的山嵐雲霧、青苔石階與紀伊半島的巨木靈魂。」", "leadImg": "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=1200&q=80", "leadCaption": "和歌山大門坂石階古道，兩側聳立數百年樹齡的夫婦杉巨木群。", "blurb": "超越一般走馬看花，我們為您淬鍊出浸潤千年神聖靈性與靈山朝聖文化的非凡旅程。", "p1": "一千多年來，從平安時代的皇族貴族到跋涉萬里的僧侶信眾，無數心靈沿著這條山徑走向紀伊半島深處。熊野古道不單單是一條登山健行步道，更是一座深植於溫帶原始雨林之中的露天神殿。", "p2": "在參天古杉的綠蔭之下，雨露凝結在青翠苔蘚上。每一步被草鞋摩擦光滑的石階，都在無聲訴說著古老信念：身體的極限跋涉，正是靈魂煥然新生的必經洗禮。", "diningEyebrow": "風土旬味 ＆ 山海割烹", "diningTitle": "地爐柴燒 ＆ 朝聖地道美味", "diningCards": [{"photo": "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=700&q=80", "badge": "紀州備長炭燒", "title": "吉野山莊 地爐炭火會席", "sub": "熊野牛 ＆ 山林旬菜 ｜ 本宮", "desc": "在古民家地爐邊享用備長炭慢烤溪魚、自產香菇與特選熊野黑毛和牛陶板燒。", "loc": "熊野本宮", "btn": "預約席位 ➔", "url": "https://tw.trip.com/hotels/list?city=Tanabe&Allianceid=9507030&SID=325761227&trip_sub3=D20272275"}, {"photo": "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=700&q=80", "badge": "傳承手打蕎麥", "title": "三四郎 手打十割蕎麥", "sub": "100% 石臼挽蕎麥 ｜ 那智山", "desc": "以熊野深山靈泉手擀現煮的十割冰鎮蕎麥麵，沾佐辛香現磨生山葵與獨門醬汁。", "loc": "那智大瀑布步道", "btn": "查看地點 ➔", "url": "#"}, {"photo": "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=700&q=80", "badge": "海港烘焙工坊", "title": "熊野自家烘焙所", "sub": "單品手沖咖啡 ｜ 勝浦港", "desc": "眺望勝浦黑潮金槍魚漁港，以雪松天然泉水萃取的單品深焙咖啡。", "loc": "勝浦漁港", "btn": "瀏覽菜單 ➔", "url": "#"}], "planEyebrow": "精選 3 日朝聖藍圖", "planTitle": "熊野古道中邊路行旅", "days": [{"day": "Day 01", "title": "田邊出發至瀧尻王子：踏入神明國度", "desc": "搭乘黑潮特急由關西機場抵達田邊，於瀧尻王子起步，穿過巨大的樟樹樹根，抵達高原「霧之里」眺望層疊山嵐。"}, {"day": "Day 02", "title": "發心門王子至熊野本宮大社", "desc": "沿著茶園與梯田的幽靜山稜步道漫步，抵達熊野信仰中心本宮大社，並於大齋原參拜高達34公尺的全日本第一大鳥居。"}, {"day": "Day 03", "title": "大門坂古杉步道 ＆ 那智神秘大瀑布", "desc": "漫步走過大門坂數百年石階，抵達青岸渡寺紅色三重塔，遠眺落差133米直衝深潭的神聖那智大瀑布。"}], "affiliateTitle": "啟程規劃您的熊野靈性之旅", "affiliateDesc": "即刻比價預訂大阪關西機場 (KIX) 直航班機，並預約專屬專車接送或紀伊半島包車。", "flightBtn": "✈️ 查詢大阪 (KIX) 最優機票 ➔", "flightUrl": "https://tw.trip.com/flights/taipei-to-osaka?Allianceid=9507030&SID=325761227&trip_sub3=D20272275", "carBtn": "🚗 預約紀伊半島專屬包車 ➔", "carUrl": "https://tw.trip.com/carhire?Allianceid=9507030&SID=325761227&trip_sub3=D20272275"}, "ja": {"title": "熊野古道", "fullTitle": "熊野古道：神仏宿る祈りの道 ｜ JAPAN TABI 特集", "meta": "世界文化遺産巡礼 ｜ 森林セラピーロード", "subtitle": "「千年の霧、苔生す石畳、そして紀伊半島の巨木が語る悠久の記憶。」", "leadImg": "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=1200&q=80", "leadCaption": "和歌山県・大門坂。樹齢数百年の夫婦杉が立ち並ぶ荘厳な石畳古道。", "blurb": "単なる観光を超えて、千年の祈りと深遠なる巡礼文化に身を委ねる極上の旅路を創造します。", "p1": "千年以上もの昔から、平安の皇族から名もなき旅人に至るまで、人々は救いを求めて紀伊山地の奥深くへと歩みを進めました。熊野古道は単なる山道ではなく、原生林の中に拓かれた天然の神殿です。", "p2": "巨杉が覆う静寂のなか、雨露が鮮やかな青苔を濡らします。無数のわらじによって磨かれた石段を踏みしめるとき、身体の疲労こそが心の再生をもたらすのだと実感させられます。", "diningEyebrow": "風土と美味", "diningTitle": "囲炉裏料理と巡礼の味わい", "diningCards": [{"photo": "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=700&q=80", "badge": "備長炭炭火焼", "title": "吉野山荘 囲炉裏会席", "sub": "熊野牛と山菜の饗宴 ｜ 本宮", "desc": "紀州備長炭でじっくり焼き上げる天然川魚と、特選熊野牛の陶板焼きを古民家で堪能。", "loc": "熊野本宮", "btn": "お席を予約 ➔", "url": "https://tw.trip.com/hotels/list?city=Tanabe&Allianceid=9507030&SID=325761227&trip_sub3=D20272275"}, {"photo": "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=700&q=80", "badge": "伝統の手打ち蕎麦", "title": "手打蕎麦 三四郎", "sub": "石臼挽き十割蕎麦 ｜ 那智山", "desc": "熊野の名水で打つ挽きたて十割蕎麦。本わさびと出汁が香る極上の一杯。", "loc": "那智の滝参道", "btn": "場所を見る ➔", "url": "#"}, {"photo": "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=700&q=80", "badge": "港町の珈琲焙煎所", "title": "熊野珈琲ロースタリー", "sub": "シングルオリジン ｜ 勝浦港", "desc": "太平洋を望む港町で、名水を用いて丁寧にハンドドリップされる自家焙煎珈琲。", "loc": "勝浦港", "btn": "メニュー ➔", "url": "#"}], "planEyebrow": "厳選 3 日間モデルコース", "planTitle": "熊野古道 中辺路の旅路", "days": [{"day": "Day 01", "title": "田辺から滝尻王子へ：聖域への第一歩", "desc": "関西空港から特急くろしお号で田辺へ。神域の入口とされる滝尻王子から高原の霧の里へ登り、連なる山々を望む。"}, {"day": "Day 02", "title": "発心門王子から熊野本宮大社へ", "desc": "茶畑が広がる穏やかな尾根道を抜け、熊野信仰の中心地・本宮大社へ。大斎原の日本最大の大鳥居に参拝。"}, {"day": "Day 03", "title": "大門坂の巨杉並木と那智大滝", "desc": "樹齢800年の杉並木が続く大門坂を下り、青岸渡寺の三重塔と落差133mの神聖な那智大滝を望む。"}], "affiliateTitle": "熊野巡礼の旅を計画する", "affiliateDesc": "関西国際空港 (KIX) 直行便を予約し、紀伊半島を快適に巡る専用車・ハイヤーを手配。", "flightBtn": "✈️ 大阪 (KIX) 行きフライトを検索 ➔", "flightUrl": "https://tw.trip.com/flights/taipei-to-osaka?Allianceid=9507030&SID=325761227&trip_sub3=D20272275", "carBtn": "🚗 紀伊半島専用ハイヤーを予約 ➔", "carUrl": "https://tw.trip.com/carhire?Allianceid=9507030&SID=325761227&trip_sub3=D20272275"}}, {"id": "fuji", "issueNo": "Issue No. 02", "tag": "3 Days Wilderness", "price": "$520", "coverImg": "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80", "en": {"title": "Mount Fuji & Motosu", "fullTitle": "Mount Fuji & Motosu: Whispering Pines & Inverted Reflections", "meta": "Alpine Reflections ｜ Wilderness Glamping", "subtitle": "“Waking at dawn by the edge of Lake Motosu to witness the timeless symmetrical mirror of Mount Fuji in crisp alpine stillness.”", "leadImg": "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80", "leadCaption": "The iconic inverted Fuji reflection (Sakasafuji) mirrored on the crystal glass surface of Lake Motosu.", "blurb": "Experience pure alpine wilderness and vanlife glamping right where the 1,000-yen note view of Mount Fuji was born.", "p1": "While millions view Mount Fuji from crowded observation towers, true quietude resides along its western foothills. Here, Lake Motosu—the deepest of the Fuji Five Lakes—remains untouched by modern high-rises. In winter and late autumn, cold air descends from the caldera, settling the lake surface into a mirror that immortalized the 1,000-yen note view.", "p2": "Glamping and vanlife have qui 式紅色可口可樂冰箱門，進入這座放著爵士樂、直面白樺雪景的私密酒吧。", "loc": "比羅夫中央街", "btn": "營業時間 ➔", "url": "#"}], "planEyebrow": "精選 3 日北國粉雪藍圖", "planTitle": "北海道極致粉雪巡禮", "days": [{"day": "Day 01", "title": "新千歲機場至二世谷比羅夫滑雪場", "desc": "搭乘專屬雪場巴士或包車直達比羅夫，入住直通雪道 (Ski-in/Ski-out) 的奢華木屋，租借專業粉雪板，體驗夜滑燈光雪道。"}, {"day": "Day 02", "title": "花園滑雪場初雪 ＆ 五色溫泉野湯", "desc": "清晨搭乘花園雪場第一班纜車搶攻無痕野雪碗狀雪道；午後前往隱匿於山坳間的五色溫泉，浸泡在天然硫磺乳白溫泉中。"}, {"day": "Day 03", "title": "小樽海港海鮮盛宴 ＆ 雪景運河漫步", "desc": "下山沿著海岸線前往小樽，在三角市場大啖澎湃爆滿的生海膽鮭魚卵丼，午後漫步在煤氣燈閃爍的雪景小樽運河畔。"}], "affiliateTitle": "規劃您的北海道極致滑雪行", "affiliateDesc": "預訂札幌新千歲 (CTS) 直飛航班，並安排具備雪胎、車頂雪板架的 4WD 商務專車機場接送。", "flightBtn": "✈️ 查詢札幌 (CTS) 最優機票 ➔", "flightUrl": "https://tw.trip.com/flights/taipei-to-sapporo?Allianceid=9507030&SID=325761227&trip_sub3=D20272275", "carBtn": "🚗 預約 4WD 雪地專用包車 ➔", "carUrl": "https://tw.trip.com/carhire?Allianceid=9507030&SID=325761227&trip_sub3=D20272275"}, "ja": {"title": "北海道ニセコ", "fullTitle": "ニセコ：世界を魅了する極上JAPOW ｜ JAPAN TABI 特集", "meta": "パウダースノーパラダイス ｜ 雪山温泉ライフ", "subtitle": "「白樺の森を滑り抜ける浮遊感のあと、雪見の露天風呂で温まる至福のトワイライト。」", "leadImg": "https://images.unsplash.com/photo-1546548970-71785318a17b?auto=format&fit=crop&w=1200&q=80", "leadCaption": "ニセコユナイテッドの雪尾根の向こうに聳え立つ、秀麗なる蝦夷富士・羊蹄山。", "blurb": "世界中のスキーヤーが憧れる奇跡の粉雪と、暖炉が揺れる隠れ家バーで味わう至高の冬時間。", "p1": "冬、シベリアからの寒気団が日本海を渡り、湿気を蓄えて北海道西部の山々に衝突します。その結果生まれるのが、世界で最も軽くシルキーな奇跡の雪――スキー文化で「JAPOW」と称賛される極上パウダースノーです。", "p2": "ニセコでのスキーは五感すべてで愉しむ儀式です。ツリーランの浮遊感に酔いしれた後は、毛蟹や濃厚な雲丹、スモーキーなウイスキーとともに炉端焼きに舌鼓を打ちます。", "diningEyebrow": "アフタースキーの美食", "diningTitle": "炉端割烹と隠れ家バー", "diningCards": [{"photo": "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=700&q=80", "badge": "三ツ星の系譜", "title": "鮨 心 by 宮川", "sub": "伝統の江戸前鮨 ｜ ヒラフビレッジ", "desc": "北海道産のボタンエビ、タラバガニ、熟成マグロを赤酢のシャリとともに握る極上の江戸前鮨。", "loc": "ニセコヒラフ", "btn": "席を予約 ➔", "url": "#"}, {"photo": "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=700&q=80", "badge": "伝統バーンスタイル", "title": "The Barn by Odin", "sub": "北海道ビストロ ｜ 伝統木造納屋", "desc": "伝統的な納屋建築に着想を得たビストロ。熱々の白老牛ステーキやチーズフォンデュを地ビールとともに。", "loc": "下ヒラフ", "btn": "レストランを見る ➔", "url": "#"}, {"photo": "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=700&q=80", "badge": "隠し扉のバー", "title": "Bar Gyu+ (冷蔵庫の扉)", "sub": "クラフトカクテル＆ウイスキー", "desc": "雪に埋もれた赤いコカコーラ冷蔵庫の扉を開けると広がる、ライトアップされた白樺を望むジャズバー。", "loc": "ヒラフセンター", "btn": "営業時間 ➔", "url": "#"}], "planEyebrow": "厳選 3 日間モデルコース", "planTitle": "北海道スノーサファリ", "days": [{"day": "Day 01", "title": "新千歳空港からニセコヒラフへ", "desc": "空港から直行スキータクシーでヒラフへ。スキーイン・スキーアウト可能なロッジにチェックインし、ナイターを満喫。"}, {"day": "Day 02", "title": "花園ファーストトラックと五色温泉", "desc": "朝一番のリフトでノートラックのパウダーボウルへドロップイン。午後は山奥の秘湯・五色温泉の硫黄泉で筋肉を解きほぐす。"}, {"day": "Day 03", "title": "小樽港の海鮮丼と運河散策", "desc": "海岸沿いをドライブして小樽へ。三角市場で溢れんばかりのウニ丼を味わい、ガス灯灯る雪の小樽運河を散策。"}], "affiliateTitle": "ニセコスキートリップを計画する", "affiliateDesc": "札幌 (CTS) 行き航空券を予約し、スタッドレスタイヤ完備の4WDハイヤーを手配。", "flightBtn": "✈️ 札幌行き航空券を検索 ➔", "flightUrl": "https://tw.trip.com/flights/taipei-to-sapporo?Allianceid=9507030&SID=325761227&trip_sub3=D20272275", "carBtn": "🚗 4WDスノーハイヤーを予約 ➔", "carUrl": "https://tw.trip.com/carhire?Allianceid=9507030&SID=325761227&trip_sub3=D20272275"}}, {"id": "kyushu", "issueNo": "Issue No. 05", "tag": "3 Days Scenic Rail", "price": "$590", "coverImg": "https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=800&q=80", "en": {"title": "Kyushu by Rail", "fullTitle": "Kyushu by Rail: The Emerald Forest Odyssey", "meta": "Heritage Railway ｜ Volcanic Thermal Valleys", "subtitle": "“Aboard Eiji Mitooka’s legendary vintage green express, gliding through river gorges into Yufuin’s morning mists.”", "leadImg": "https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=1200&q=80", "leadCaption": "The Yufuin no Mori crossing the Jion Falls bridge amid dense mountain gorges, Oita Prefecture.", "blurb": "Embark on a romantic journey across volcanic valleys aboard Japan’s most celebrated designer sightseeing trains.", "p1": "Rail t urated 3-Day Rail Blueprint", "planTitle": "The Kyushu Scenic Express", "days": [{"day": "Day 01", "title": "Hakata to Yufuin via Yufuin no Mori", "desc": "Board the 09:17 AM scenic service from Hakata Station. Enjoy the commemorative onboard bento and view Jion Falls. Stroll Yunotsubo High Street and check into a private hot spring ryokan."}, {"day": "Day 02", "title": "Kinrin Lake Morning Steam & Transit to Beppu", "desc": "Catch the ethereal early mist on Lake Kinrin at 07:00 AM. Take the midday local scenic rail to Beppu to explore the volcanic 'Hells' (Jigoku) and steam-cooked seafood."}, {"day": "Day 03", "title": "Aso Boy! Express Across the Caldera", "desc": "Board the panoramic 'Aso Boy!' train ascending the rim of Mount Aso volcano. Take in sweeping grasslands and grazing cattle before returning to Kumamoto or Fukuoka."}], "affiliateTitle": "Embark on Your Kyushu Rail Journey", "affiliateDesc": "Secure Fukuoka (FUK) direct flights and reserve your official JR Kyushu Rail Pass or private station transfers.", "flightBtn": "✈️ Compare Fukuoka (FUK) Flights ➔", "flightUrl": "https://tw.trip.com/flights/taipei-to-fukuoka?Allianceid=9507030&SID=325761227&trip_sub3=D20272275", "carBtn": "🚂 JR Kyushu Rail Pass & Transfers ➔", "carUrl": "https://tw.trip.com/trains?Allianceid=9507030&SID=325761227&trip_sub3=D20272275"}, "zh": {"title": "九州觀光鐵道", "fullTitle": "九州觀光鐵道：翠綠森林與溫泉之詩 ｜ JAPAN TABI 深度名鑑", "meta": "經典設計鐵道 ｜ 火山溫泉山谷漫遊", "subtitle": "「搭乘水戶岡銳治筆下的傳奇翡翠綠觀光列車，穿行於溪谷瀑布間，駛入由布院的晨霧。」", "leadImg": "https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=1200&q=80", "leadCaption": "由布院之森列車穿過大分縣深山峽谷與慈恩瀑布鐵橋。", "blurb": "搭乘全日本最負盛名的觀光設計列車，沉醉於森林原木車廂、溫泉旅館會席與金鱗湖晨霧。", "p1": "在九州，搭乘鐵道旅行不僅僅是移動，更是一場溫柔浪漫的藝術行禮。由工業設計大師水戶岡銳治操刀的「由布院之森」號列車，其溫潤的金屬翠綠色塗裝，與大分縣蒼翠的雪松山林與水氣蒸騰的溪谷完美融為一體。", "p2": "走進車廂，映入眼簾的是溫暖的實木拼接地板、復古黃銅把手以及迎面撲來的原木清香。手捧一份精緻的豐後牛便當與柚子胡椒冰淇淋，倚著高挑全景車窗，任由列車徐徐駛向由布岳山麓，這便是慢活旅行的極致享受。", "diningEyebrow": "溫泉鄉風土 ＆ 湖畔茶室", "diningTitle": "名門溫泉會席 ＆ 地獄蒸天然料理", "diningCards"
