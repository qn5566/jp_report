name: Update snow report

on:
  schedule:
    # 日本時間 06:00 = UTC 21:00（前一天）
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch snow data
        run: python scripts/update_snow.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain data/snow_today.json app/data/snow_today.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/snow_today.json app/data/snow_today.json
            git commit -m "chore: update daily snow report"
            git push
          else
            echo "No changes in data/snow_today.json"
          fi

